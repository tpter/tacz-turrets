modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="TACZ Turrets"
description='''
Three turret bases that fire TACZ guns.

1. Fixed Turret: an AeroIE turret body bolted to a Sable physics block. It never
   rotates on its own; it only follows the physics body it is mounted on.
2. Control Seat Turret: an AeroIE turret body that is linked to an AeroIE control
   seat. It follows the seat occupant's mouse aim and fires on the seat fire key.
3. Create Turret: a turret body driven by a Create Big Cannons cannon mount. Yaw
   and pitch shaft speed is read from the mount and applied to the turret, and the
   mount's redstone fire signal triggers shooting.

All three use TACZ guns and TACZ ammo. TACZ ammo items, TACZ ammo boxes and TACZ
infinite ammo boxes can be loaded; matching ammo type is enforced by TACZ itself.
'''

